site_name: Loki for Mere Mortals
site_description: Prometheus-style storage for log lines. Run one Loki server, give every line a few labels, push logs in over HTTP, and ask questions in LogQL, from your first stored line to retention, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/loki-for-mere-mortals/

# Loki in single-binary ("monolithic") mode, storing on the local
# filesystem. auth_enabled is false, so there are no tenants: this
# is the lab configuration from "Loki for Mere Mortals", with the
# paths pointing at the lab's scratch folder. On your own machine,
# point path_prefix and the two directories under it wherever you
# want Loki's data to live.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /home/hatch/workspace/build-check/loki-scratch/data
  storage:
    filesystem:
      chunks_directory: /home/hatch/workspace/build-check/loki-scratch/data/chunks
      rules_directory: /home/hatch/workspace/build-check/loki-scratch/data/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h

analytics:
  reporting_enabled: false
